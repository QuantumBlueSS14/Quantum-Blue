- type: gameMap
  id: Train
  mapName: 'Train'
  mapPath: /Maps/train.yml
  maxRandomOffset: 0
  randomRotation: false
  minPlayers: 35
  maxPlayers: 80
  stations:
    Train:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_DV/Shuttles/NTES_Kaeri.yml
        - type: StationNameSetup
          mapNameTemplate: 'Train "Sentipode" {0}-{1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'DV'
        - type: StationJobs
          availableJobs: # Max of 76 inc. latejoins and trainees.
            # command - 3
            AdministrativeAssistant: [ 1, 1 ]
            Captain: [ 1, 1 ]
            StationAi: [ 1, 1 ]
            # service - 13
            HeadOfPersonnel: [ 1, 1 ]
            Bartender: [ 1, 2 ]
            Botanist: [ 2, 2 ]
            Chef: [ 1, 2 ]
            Clown: [ 1, 1 ]
            Reporter: [ 1, 1 ]
            Musician: [ 1, 1 ]
            Janitor: [ 1, 2 ]
            Mime: [ 1, 1 ]
            # engineering 10
            ChiefEngineer: [ 1, 1 ]
            AtmosphericTechnician: [ 3, 3 ]
            StationEngineer: [ 4, 4 ]
            TechnicalAssistant: [ 2, 2 ]
            #justice 4
            ChiefJustice: [ 1, 1 ]
            Clerk: [ 1, 1 ]
            Lawyer: [ 1, 1 ]
            Prosecutor: [ 1, 1 ]
            # medical 13
            ChiefMedicalOfficer: [ 1, 1 ]
            Chemist: [ 2, 2 ]
            Paramedic: [ 3, 3 ]
            MedicalDoctor: [ 3, 3 ]
            MedicalIntern: [ 2, 2 ]
            Psychologist: [ 1, 1 ]
            Surgeon: [ 1, 1 ]
            # science 12
            ResearchDirector: [ 1, 1 ]
            Chaplain: [ 1, 1 ]
            Roboticist: [ 2, 2 ]
            Scientist: [ 4, 4 ]
            ResearchAssistant: [ 2, 2 ]
            Borg: [ 2, 2 ]
            # security 12
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            Detective: [ 1, 1 ]
            Brigmedic: [ 1, 1 ]
            SecurityCadet: [ 3, 3 ]
            SecurityOfficer: [ 5, 5 ]
            # supply 9
            Quartermaster: [ 1, 1 ]
            Courier: [ 1, 1 ]
            SalvageSpecialist: [ 3, 3 ]
            CargoTechnician: [ 3, 3 ]
            SupplyAssistant: [ 1, 1 ]
            # civilian
            Passenger: [ -1, -1 ]
